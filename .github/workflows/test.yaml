---
name: test
on: pull_request
jobs:
  list:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read # For checkout a private repository
      pull-requests: write
    outputs:
      targets: ${{steps.list-targets.outputs.targets}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: List Targets
        uses: suzuki-shunsuke/tfaction@latest
        id: list-targets
        with:
          action: list-targets

      - name: Hide old comments
        uses: suzuki-shunsuke/tfaction@latest
        with:
          action: hide-comment

  plan:
    name: "plan (${{matrix.target.target}})"
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [list]
    permissions:
      contents: read
    env:
      TFACTION_TARGET: "${{matrix.target.target}}"
      TFACTION_WORKING_DIR: ${{matrix.target.working_directory}}
      TFACTION_JOB_TYPE: ${{matrix.target.job_type}}
      TFLINT_CONFIG_FILE: ${{github.workspace}}/.tflint.hcl
    if: "join(fromJSON(needs.list.outputs.targets), '') != ''"
    strategy:
      fail-fast: false
      matrix:
        target: ${{fromJSON(needs.list.outputs.targets)}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Create GitHub App installation access token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up
        uses: suzuki-shunsuke/tfaction@latest
        with:
          action: setup
          github_token: ${{ steps.token.outputs.token }}

      - name: terraform init
        uses: suzuki-shunsuke/tfaction@latest
        with:
          action: terraform-init
          github_token: ${{ steps.token.outputs.token }}

      - name: Lint
        uses: suzuki-shunsuke/tfaction@latest
        with:
          action: test
          github_token: ${{ steps.token.outputs.token }}

      - name: Plan
        uses: suzuki-shunsuke/tfaction@latest
        with:
          action: plan
          github_token: ${{ steps.token.outputs.token }}

  plan-label:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [plan]
    permissions:
      pull-requests: read
      issues: write
    # no-op, create, update, delete
    # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context
    # needs.<job_id>.outputs.result_summary
    steps:
      - name: Add plan label
        uses: suzuki-shunsuke/tfaction@pr/3725
        with:
          action: plan-label
