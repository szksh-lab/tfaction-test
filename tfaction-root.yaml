# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/tfaction/refs/heads/latest/schema/tfaction-root.json
plan_workflow_name: test.yaml

terraform_docs:
  enabled: true

labels:
  - regexp: "^.*foo$"
    label: foo2
    color: 8e1f1b

tflint:
  enabled: true
trivy:
  enabled: false

target_groups:
  - working_directory: "**"
    template_dir: templates/hello
