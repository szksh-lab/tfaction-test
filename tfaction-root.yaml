plan_workflow_name: test.yaml
available_providers:
  - name: registry.terraform.io/hashicorp/null
  - name: registry.terraform.io/integrations/github
target_groups:
  - working_directory: "**"
update_local_path_module_caller:
  enabled: false
drift_detection:
  enabled: true
  # Repository where issues are created. Defaults to the repository where tfaction runs.
  # issue_repo_owner: suzuki-shunsuke
  # issue_repo_name: tfaction-example
  # Maximum number of drift issues processed per scheduled job run. Default is 1.
  num_of_issues: 1
  minimum_detection_interval: 0
